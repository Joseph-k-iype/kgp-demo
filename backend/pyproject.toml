[project]
name = "atlas-knowledge-catalog"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "pydantic-settings>=2.8,<3",
    "minio>=7.2,<8",
    "rdflib>=7.1,<8",
    "pyshacl>=0.30,<1",
    "httpx>=0.28,<1",
    "sentence-transformers>=3.4,<6",
    "openai>=1.75,<3",
    "langgraph>=0.4,<2",
    "langgraph-checkpoint-postgres>=2,<4",
    "mcp>=2,<3",
    "fastmcp==4.0.11",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
