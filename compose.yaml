name: atlas-knowledge-catalog
services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_local_demo
    ports: ["127.0.0.1:56432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: atlasdemo
      MINIO_ROOT_PASSWORD: atlas_local_demo
    ports: ["127.0.0.1:59010:9000", "127.0.0.1:59011:9001"]
    volumes: ["minio:/data"]
  fuseki:
    build:
      context: .
      dockerfile: infra/fuseki.Dockerfile
    ports: ["127.0.0.1:53030:3030"]
    volumes: ["rdf:/data"]
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:59200:9200"]
    volumes: ["search:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 30
volumes:
  postgres:
  minio:
  rdf:
  search:
